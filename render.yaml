# One-click deploy of the live dashboard (Render blueprint).
#
#   https://render.com  ->  New  ->  Blueprint  ->  point at this repo
#
# Deployed WITHOUT the LLM investigator on purpose: putting an Anthropic key on
# a public host means anyone who loads the page can spend credits through
# /api/merchants/{id}/investigate. Detection, entity graphs, the review queue,
# the economics counter and the pitch tab all work without it. The agent is
# demonstrated in the pitch video, where the key stays local.
services:
  - type: web
    name: fraud-spike-investigator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-serve.txt
    # A free instance sleeps after 15 minutes, so every visitor used to trigger
    # a cold boot and therefore see a LIVE replay - the 86s wait was the only
    # thing making the demo look live. An uptime pinger on /api/health removes
    # the wait, and without a loop it would leave every visitor staring at a
    # FINISHED replay for a month instead. Trains once, streams on repeat.
    #
    # --loop below is now REDUNDANT and kept only as documentation: looping is
    # derived from --defer-prepare in run_demo.should_loop(), because putting it
    # here alone did not work. Render redeployed the code but NOT the
    # blueprint's start command, so the live service kept serving a single
    # finished pass - /api/status sat at 14160/14160 for 92 seconds when a
    # restart was due at 42. The behaviour must not depend on a dashboard
    # having been synced.
    startCommand: python run_demo.py --host 0.0.0.0 --port $PORT --no-browser --no-agent --defer-prepare --speed 800 --loop --loop-pause 15
    envVars:
      # 3.11 not 3.11.9: an exact patch pin fails if the host has not built
      # that specific version. Every dependency here requires >=3.11.
      - key: PYTHON_VERSION
        value: "3.11"
      # Write endpoints need this. Render generates one; nobody has to set it.
      - key: FSI_API_KEY
        generateValue: true
